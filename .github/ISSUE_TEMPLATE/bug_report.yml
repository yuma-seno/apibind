name: Bug Report
description: Report a bug in apibind
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: A minimal Go snippet that demonstrates the bug.
      render: go
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version
      placeholder: "go1.23.0"
    validations:
      required: true
  - type: input
    id: apibind-version
    attributes:
      label: apibind version
      placeholder: "v0.1.0"
    validations:
      required: true
